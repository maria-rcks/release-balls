name: release contributor video
on:
  release:
    types: [published]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: release-balls-${{ github.event.release.id }}
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - id: assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$encoded_tag" >> "$GITHUB_OUTPUT"
      - uses: maria-rcks/release-balls@fa8d4eb9652bbf944b6bea767666b312da7ffb40
        id: balls
        with:
          format: both
          asset-base-url: ${{ steps.assets.outputs.url }}
      - name: Attach media and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MEDIA_DIR: ${{ steps.balls.outputs.directory }}
          MARKDOWN: ${{ steps.balls.outputs.markdown }}
        shell: bash
        run: |
          shopt -s nullglob
          media=("$MEDIA_DIR"/*.gif "$MEDIA_DIR"/*.mp4)
          gh release upload "$RELEASE_TAG" "${media[@]}" --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          awk '
            /^<!-- release-balls:start -->$/ { skip=1; next }
            /^<!-- release-balls:end -->$/ { skip=0; next }
            !skip { print }
          ' "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/updated.md"
          {
            printf '\n<!-- release-balls:start -->\n'
            cat "$MARKDOWN"
            printf '<!-- release-balls:end -->\n'
          } >> "$RUNNER_TEMP/updated.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/updated.md"
      - uses: actions/upload-artifact@v4
        with:
          name: release-media
          path: ${{ steps.balls.outputs.directory }}
