name: Release Balls
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: maria-rcks/release-balls@a59c80cd8076017652b293939b69e4fd50628696
        id: balls
        with:
          repository: pingdotgg/t3code
          releases: '5'
          match: nightly
          metric: merger
          format: both

      - uses: actions/upload-artifact@v4
        with:
          name: release-media
          path: ${{ steps.balls.outputs.directory }}
