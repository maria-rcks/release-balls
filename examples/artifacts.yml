name: Release Balls
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: maria-rcks/release-balls@1ad59ac9696bad1353b77766a94fe0a186aa60ab
        id: balls
        with:
          repository: pingdotgg/t3code
          releases: '5'
          match: nightly
          metric: merger
          format: both

      - uses: actions/upload-artifact@v4
        with:
          name: release-media
          path: ${{ steps.balls.outputs.directory }}
