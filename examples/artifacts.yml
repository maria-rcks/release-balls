name: Release Balls
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: maria-rcks/release-balls@ede6c450a5894f01c52b1d8fab9ac2e7bc0022ca
        id: balls
        with:
          repository: pingdotgg/t3code
          releases: '5'
          match: nightly
          metric: merger
          format: both

      - uses: actions/upload-artifact@v4
        with:
          name: release-media
          path: ${{ steps.balls.outputs.directory }}
