name: release balls
description: Render release contributor videos and GIFs with Pillow and FFmpeg
inputs:
  repository:
    description: GitHub owner/repository to read
    default: ${{ github.repository }}
  token:
    description: Read-only GitHub token for the source repository
    default: ${{ github.token }}
  releases:
    description: Number of published releases
    default: '5'
  match:
    description: Substring in release tags (empty matches all)
    default: nightly
  metric:
    description: author, merger, or changes (added + deleted lines by author)
    default: author
  users:
    description: Optional comma-separated GitHub logins
    default: ''
  format:
    description: mp4, gif, or both
    default: mp4
  output:
    description: Output directory
    default: release-balls-output
outputs:
  directory:
    description: Absolute directory containing generated media and JSON
    value: ${{ steps.render.outputs.directory }}
  manifest:
    description: JSON with rankings and generated file paths
    value: ${{ steps.render.outputs.manifest }}
  data:
    description: Source GitHub release and PR snapshot
    value: ${{ steps.render.outputs.data }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false
    - name: Install FFmpeg if missing
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi
    - id: render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RB_REPOSITORY: ${{ inputs.repository }}
        RB_RELEASES: ${{ inputs.releases }}
        RB_MATCH: ${{ inputs.match }}
        RB_METRIC: ${{ inputs.metric }}
        RB_USERS: ${{ inputs.users }}
        RB_FORMAT: ${{ inputs.format }}
        RB_OUTPUT: ${{ inputs.output }}
      run: |
        uv run --project "$GITHUB_ACTION_PATH" --frozen release-balls \
          --repo "$RB_REPOSITORY" --releases "$RB_RELEASES" --match "$RB_MATCH" \
          --metric "$RB_METRIC" --users "$RB_USERS" --format "$RB_FORMAT" --out "$RB_OUTPUT"
